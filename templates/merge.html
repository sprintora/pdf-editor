{% extends "base.html" %}
{% block title %}Merge PDFs{% endblock %}
{% block content %}
<a href="{{ url_for('index') }}" class="back">← All tools</a>
<h1>Merge PDFs</h1>

<div id="dropzone" class="dropzone" tabindex="0" role="button">
  <div class="dz-icon">📥</div>
  <strong>Drag PDF files here</strong> or click to browse
  <input type="file" id="file-input" accept="application/pdf,.pdf" multiple hidden>
</div>

<p class="muted">Each PDF is a card. <strong>Drag the cards</strong> to change the order — files are merged from 1 onwards.</p>
<div id="cards" class="card-grid"></div>

<div class="actions">
  <button id="go" type="button" disabled>Merge &amp; preview</button>
  <span id="status" class="muted"></span>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='merge.js') }}"></script>{% endblock %}
