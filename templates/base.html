<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %} · {{ app_name }}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a href="{{ url_for('index') }}" class="brand">
      <img src="{{ url_for('static', filename='logo-mark.png') }}" alt="" class="brand-logo">
      <span>{{ app_name }}</span>
    </a>
    <a href="{{ url_for('about') }}" class="about-link{% if request.endpoint in ('about', 'licenses') %} active{% endif %}"
       title="About {{ app_name }}" aria-label="About {{ app_name }}">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="11" x2="12" y2="17"></line>
        <circle cx="12" cy="7.5" r="0.6" fill="currentColor"></circle>
      </svg>
    </a>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="alert">{{ m }}</div>{% endfor %}
    {% endwith %}
    <div id="js-alert" class="alert" role="alert" hidden></div>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
