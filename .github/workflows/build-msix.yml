name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $tess = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$tess\tesseract.exe")) {
            throw "Tesseract not found at $tess"
          }
          & "$tess\tesseract.exe" --version

      - name: Install dependencies and bundle OCR
        shell: cmd
        run: call setup_build.bat

      - name: Build EXE with PyInstaller
        shell: cmd
        run: call build_exe.bat

      - name: Show what was built
        if: always()
        shell: pwsh
        run: |
          if (Test-Path dist) {
            Get-ChildItem dist -Recurse -Depth 2 | Select-Object -First 40 -ExpandProperty FullName
          } else {
            Write-Host "No dist folder"
          }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: EditoraPDFEdit-windows
          path: dist/
          if-no-files-found: error
