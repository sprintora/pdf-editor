name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $tess = "C:\Program Files\Tesseract-OCR"
          if (-not (Test-Path "$tess\tesseract.exe")) {
            throw "Tesseract not found at $tess"
          }
          & "$tess\tesseract.exe" --version

      - name: Install dependencies and bundle OCR
        shell: cmd
        run: call setup_build.bat

      - name: Show what was built
        if: always()
        shell: pwsh
        run: |
          Write-Host "--- Top-level folders ---"
          Get-ChildItem -Directory | Select-Object -ExpandProperty Name
          Write-Host "--- All .exe files in the workspace (excluding venv) ---"
          Get-ChildItem -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\(venv|\.venv|Lib|Scripts)\\' } |
            Select-Object -ExpandProperty FullName
          Write-Host "--- dist folder ---"
          if (Test-Path dist) { Get-ChildItem dist -Recurse | Select-Object -First 50 -ExpandProperty FullName } else { Write-Host "No dist folder" }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: EditoraPDFEdit-windows
          path: dist/
          if-no-files-found: error
